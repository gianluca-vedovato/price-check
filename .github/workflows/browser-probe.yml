name: Browser probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright with Chromium and Google Chrome
        run: |
          npm install --no-save playwright tsx
          npx playwright install --with-deps chromium chrome
      - name: Probe (Google Chrome, stealth, homepage warm-up)
        run: xvfb-run --auto-servernum npx tsx worker/probe.ts stealth
